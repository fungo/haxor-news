line-length = 88
target-version = "py310"

exclude = [
    "haxor_news/lib/html2text",
    "haxor_news/lib/haxor",
]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "E722",  # bare except, allow for compatibility
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]
"haxor_news/lib/html2text/*" = ["E", "F", "B", "I", "C4", "UP"]  # vendored: html2text by Aaron Swartz
"haxor_news/lib/haxor/*" = ["E", "F", "B", "I", "C4", "UP"]  # vendored: haxor by Avinash Sajjanshetty
