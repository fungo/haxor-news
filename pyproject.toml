[project]
name = "haxor-news"
dynamic = ["version"]
description = "View and filter Hacker News from the command line: Posts, comments, and linked web content."
readme = { file = "README.md", content-type = "text/markdown" }
authors = [
    { name = "Donne Martin", email = "donne.martin@gmail.com" },
]
license = "Apache-2.0"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.1.8",
    "colorama>=0.4.6",
    "requests>=2.31.0,<3.0.0",
    "pygments>=2.17.0",
    "prompt-toolkit>=3.0.52",
]

[project.urls]
Homepage = "https://github.com/donnemartin/haxor-news"
Download = "https://pypi.python.org/pypi/haxor-news"
Issues = "https://github.com/donnemartin/haxor-news/issues"
Source = "https://github.com/donnemartin/haxor-news"

[project.scripts]
haxor-news = "haxor_news.main:cli"
hn = "haxor_news.main_cli:cli"

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "mock>=1.0.1",
    "html2text",
    "pexpect>=4.8.0",
]
dev = [
    "black>=25.1.0",
    "ruff>=0.3.0",
    "mypy>=1.10.0",
    "build",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["haxor_news*"]
exclude = ["tests*"]

[tool.setuptools.dynamic]
version = {attr = "haxor_news.__version__"}

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
    "--cov=haxor_news",
    "--cov-report=term-missing",
    "--cov-report=html",
]

[tool.coverage.run]
source = ["haxor_news"]
omit = ["haxor_news/lib/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | haxor_news/lib
)/
'''

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    "haxor_news/lib/html2text",
    "haxor_news/lib/haxor",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "E722",  # bare except, allow for compatibility
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B011"]
"haxor_news/lib/html2text/*" = ["E", "F", "B", "I", "C4", "UP"]
"haxor_news/lib/haxor/*" = ["E", "F", "B", "I", "C4", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "colorama.*",
    "pygments.*",
    "prompt_toolkit.*",
    "html2text.*",
]
ignore_missing_imports = true
